<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f7fb; --surface:#ffffff; --surface-2:#eef3fb; --surface-3:#e1eaf7;
  --ink:#16203a; --ink-2:#47536e; --ink-3:#6b7690; --line:#d6e0ef;
  --navy:#07066d; --brand:#0360a6; --blue:#3c6bb4; --accent:#b7790f; --ok:#1f7a4d;
  --mark:#ffe58a; --shadow:0 1px 2px rgba(16,24,40,.05),0 4px 14px rgba(16,24,40,.06);
  --head:"Montserrat",system-ui,sans-serif; --body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif; --serif:"Source Serif 4",Georgia,serif;
  --radius:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0d1222; --surface:#141b2f; --surface-2:#1a2340; --surface-3:#22305a;
    --ink:#e7ecf7; --ink-2:#b4bfd8; --ink-3:#8c98b4; --line:#2a3658;
    --navy:#a9b8ff; --brand:#6fb1ff; --blue:#8fb0ea; --accent:#f0b84a; --ok:#5fd19a;
    --mark:#6b5a12; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  --bg:#0d1222; --surface:#141b2f; --surface-2:#1a2340; --surface-3:#22305a;
  --ink:#e7ecf7; --ink-2:#b4bfd8; --ink-3:#8c98b4; --line:#2a3658;
  --navy:#a9b8ff; --brand:#6fb1ff; --blue:#8fb0ea; --accent:#f0b84a; --ok:#5fd19a;
  --mark:#6b5a12; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:128px}
body{margin:0;background:var(--bg);color:var(--ink);font:15.5px/1.6 var(--body);-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--head);color:var(--navy);line-height:1.2;margin:0}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--brand)}
mark{background:var(--mark);color:inherit;border-radius:3px;padding:0 1px}

/* top bar */
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top-inner{max-width:1320px;margin:0 auto;padding:12px 20px 0;display:flex;flex-direction:column;gap:10px}
.brandrow{display:flex;align-items:center;gap:14px;justify-content:space-between}
.brandrow .t{display:flex;flex-direction:column;min-width:0}
.brandrow .k{font:700 11px/1 var(--head);letter-spacing:.12em;text-transform:uppercase;color:var(--brand)}
.brandrow .n{font:700 17px/1.25 var(--head);color:var(--navy);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tools{display:flex;gap:8px;align-items:center;flex-shrink:0}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 11px;font-size:13px;font-weight:600;display:inline-flex;gap:6px;align-items:center}
.iconbtn:hover{border-color:var(--brand);color:var(--brand)}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin:0 -4px}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:none;padding:10px 12px 11px;font:600 13.5px/1 var(--head);color:var(--ink-3);border-bottom:3px solid transparent;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--navy);border-color:var(--brand)}
.tab:hover{color:var(--navy)}

.wrap{max-width:1320px;margin:0 auto;padding:22px 20px 80px}
.view{display:none}.view.on{display:block}

/* hero */
.hero{background:linear-gradient(120deg,#07066d 0%,#0b3d8f 55%,#3c6bb4 100%);color:#fff;border-radius:20px;padding:28px 30px;display:grid;grid-template-columns:1.4fr 1fr;gap:26px;box-shadow:var(--shadow);margin-bottom:22px}
.hero h1{color:#fff;font-size:clamp(20px,2.4vw,28px);letter-spacing:-.01em}
.hero .who{margin-top:12px;color:#d7e3ff;font-size:14px}
.hero .who b{color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.chip{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);border-radius:999px;padding:5px 11px;font:600 12.5px/1.2 var(--head)}
.hero .prog{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:16px;padding:16px 18px;align-self:center}
.prog .lbl{font:700 12px/1 var(--head);letter-spacing:.08em;text-transform:uppercase;color:#cfe0ff}
.prog .big{font:800 34px/1.1 var(--head);margin:8px 0 10px}
.bar{height:9px;background:rgba(255,255,255,.18);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:#ffd36b;border-radius:99px;transition:width .4s}
.prog p{margin:10px 0 0;font-size:13px;color:#d7e3ff}

/* notes layout */
.notes{display:grid;grid-template-columns:270px minmax(0,1fr);gap:26px;align-items:start}
.side{position:sticky;top:128px;max-height:calc(100vh - 150px);overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 10px;box-shadow:var(--shadow)}
.side h4{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);padding:10px 10px 6px}
.side a{display:flex;gap:9px;align-items:center;text-decoration:none;color:var(--ink-2);padding:7px 10px;border-radius:9px;font-size:13.5px;font-weight:500}
.side a:hover{background:var(--surface-2);color:var(--navy)}
.side a.cur{background:var(--surface-2);color:var(--navy);font-weight:600}
.side .dot{width:16px;height:16px;border-radius:50%;border:2px solid var(--line);flex-shrink:0;display:grid;place-items:center;font-size:10px;color:#fff}
.side a.done .dot{background:var(--ok);border-color:var(--ok)}
.side a.done .dot::after{content:"✓"}

.searchbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:18px}
.search{flex:1 1 280px;display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:0 12px;box-shadow:var(--shadow)}
.search input{flex:1;border:0;background:none;padding:11px 0;font:inherit;color:var(--ink);outline:none;min-width:0}
.search svg{color:var(--ink-3);flex-shrink:0}
.toggle{display:inline-flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:9px 12px;font-size:13.5px;font-weight:600;color:var(--ink-2)}
.toggle input{accent-color:var(--brand);width:16px;height:16px}
.count{font-size:13px;color:var(--ink-3)}

.sec{background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);margin-bottom:22px;overflow:hidden}
.sec-h{padding:20px 22px 16px;display:flex;gap:14px;align-items:flex-start;justify-content:space-between;border-bottom:1px solid var(--line);background:linear-gradient(180deg,var(--surface-2),var(--surface))}
.sec-h .meta{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px}
.tag{font:700 11px/1 var(--head);letter-spacing:.06em;text-transform:uppercase;padding:5px 9px;border-radius:999px;background:var(--surface-3);color:var(--navy)}
.tag.sl{background:transparent;border:1px solid var(--line);color:var(--ink-3)}
.sec-h h2{font-size:22px}
.done-btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;font:600 13px/1 var(--head);white-space:nowrap;display:inline-flex;gap:7px;align-items:center}
.done-btn[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:#fff}
.overview{margin:18px 22px 4px;padding:14px 16px;border-left:4px solid var(--brand);background:var(--surface-2);border-radius:0 12px 12px 0;color:var(--ink);font-size:15px}
.overview b{font-family:var(--head);font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--brand);display:block;margin-bottom:4px}
.paras{padding:10px 22px 4px;display:grid;gap:12px}
.pc{border:1px solid var(--line);border-radius:14px;padding:14px 16px 12px;display:grid;grid-template-columns:40px minmax(0,1fr);gap:4px 14px;background:var(--surface)}
.pc .num{grid-row:span 4;width:34px;height:34px;border-radius:10px;background:var(--surface-3);color:var(--navy);display:grid;place-items:center;font:700 13px/1 var(--head)}
.pc h3{font-size:15.5px;color:var(--navy);margin-top:5px}
.pc .lab{font:700 11px/1 var(--head);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin:8px 0 2px}
.pc .gist{margin:0;color:var(--ink)}
.pc .role{margin:0;color:var(--ink-2)}
.pc .role::before{content:"";}
.orig-btn{justify-self:start;margin-top:8px;border:0;background:none;padding:4px 0;color:var(--brand);font:600 13px/1 var(--head);display:inline-flex;gap:6px;align-items:center}
.orig{display:none;margin-top:6px;padding:12px 14px;border-radius:10px;background:var(--surface-2);font:15px/1.65 var(--serif);color:var(--ink);white-space:pre-line}
.pc.open .orig{display:block}
.pc.open .orig-btn .chev{transform:rotate(90deg)}
.chev{transition:transform .2s;display:inline-block}
.qa{padding:12px 22px 20px}
.qa h4{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin:8px 0 10px;display:flex;gap:8px;align-items:center}
details{border:1px solid var(--line);border-radius:12px;background:var(--surface);margin-bottom:8px}
details summary{list-style:none;cursor:pointer;padding:12px 14px;font-weight:600;color:var(--navy);display:flex;gap:10px;align-items:flex-start}
details summary::-webkit-details-marker{display:none}
details summary::before{content:"Q";flex-shrink:0;width:22px;height:22px;border-radius:6px;background:var(--accent);color:#fff;font:700 12px/22px var(--head);text-align:center;margin-top:1px}
details[open] summary{border-bottom:1px dashed var(--line)}
details .ans{padding:10px 14px 14px 46px;color:var(--ink-2)}
.hidden{display:none!important}

/* generic cards */
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;box-shadow:var(--shadow)}
.card h3{font-size:17px;margin-bottom:10px}
.lead{font-size:16.5px;color:var(--ink)}
.kicker{font:700 11.5px/1 var(--head);letter-spacing:.12em;text-transform:uppercase;color:var(--brand);margin:26px 0 10px}
.pitch{counter-reset:p;margin:0;padding:0;list-style:none}
.pitch li{counter-increment:p;display:grid;grid-template-columns:30px 1fr;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line)}
.pitch li:last-child{border:0}
.pitch li::before{content:counter(p);width:26px;height:26px;border-radius:50%;background:var(--brand);color:#fff;font:700 12px/26px var(--head);text-align:center}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th{background:var(--navy);color:#fff;text-align:left;padding:9px 10px;font:600 12.5px/1.3 var(--head)}
:root[data-theme="dark"] table.t th{color:#0d1222}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) table.t th{color:#0d1222}}
table.t td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
table.t tr:nth-child(even) td{background:var(--surface-2)}
.tablewrap{overflow-x:auto;border-radius:12px;border:1px solid var(--line)}
.model{width:100%;height:auto;display:block}
.model text{font-family:var(--head)}

/* script */
.timer{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 18px;box-shadow:var(--shadow);margin-bottom:16px;position:sticky;top:128px;z-index:5}
.timer .clock{font:800 30px/1 var(--head);color:var(--navy);font-variant-numeric:tabular-nums}
.timer .sub{font-size:13px;color:var(--ink-3)}
.timer .btns{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--brand);background:var(--brand);color:#fff;border-radius:10px;padding:9px 14px;font:600 13.5px/1 var(--head)}
.btn.ghost{background:transparent;color:var(--brand)}
.slide{display:grid;grid-template-columns:64px minmax(0,1fr);gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;margin-bottom:10px;box-shadow:var(--shadow)}
.slide.cur{border-color:var(--brand);box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 25%,transparent)}
.slide .sn{width:52px;height:52px;border-radius:12px;background:var(--surface-3);display:grid;place-items:center;font:800 18px/1 var(--head);color:var(--navy)}
.slide h3{font-size:16px;margin:2px 0 6px}
.slide p{margin:0;color:var(--ink-2)}

/* flashcards */
.fc-wrap{max-width:760px;margin:0 auto}
.fc-controls{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:14px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:9px 14px;font:600 13px/1 var(--head);color:var(--ink-3)}
.seg button[aria-pressed="true"]{background:var(--brand);color:#fff}
.fc{perspective:1400px;height:340px;cursor:pointer;outline:none}
.fc-in{position:relative;width:100%;height:100%;transition:transform .55s cubic-bezier(.2,.7,.2,1);transform-style:preserve-3d}
.fc.flip .fc-in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:20px;padding:30px 34px;display:flex;flex-direction:column;justify-content:center;gap:12px;box-shadow:var(--shadow);border:1px solid var(--line);overflow:auto}
.face.front{background:var(--surface)}
.face.back{background:linear-gradient(140deg,#07066d,#0b3d8f);color:#fff;transform:rotateY(180deg)}
.face .ft{font:700 11.5px/1 var(--head);letter-spacing:.12em;text-transform:uppercase;color:var(--brand)}
.face.back .ft{color:#ffd36b}
.face .fq{font:700 clamp(18px,2.4vw,24px)/1.35 var(--head);color:var(--navy)}
.face .fa{font-size:17px;line-height:1.6}
.fc-nav{display:flex;justify-content:space-between;align-items:center;margin-top:14px;gap:10px}
.fc-nav .pos{font:600 13.5px/1 var(--head);color:var(--ink-3)}
.hint{text-align:center;font-size:12.5px;color:var(--ink-3);margin-top:10px}

/* numbers */
.num-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:6px}
.num-card .v{font:800 26px/1.1 var(--head);color:var(--navy)}
.num-card .d{font-size:14px;color:var(--ink-2)}
.gl{display:grid;grid-template-columns:220px minmax(0,1fr);gap:4px 18px;padding:12px 4px;border-bottom:1px solid var(--line)}
.gl dt{font:700 14.5px/1.35 var(--head);color:var(--navy)}
.gl dd{margin:0;color:var(--ink-2)}
.ref{padding:12px 4px;border-bottom:1px solid var(--line);display:grid;gap:6px}
.ref p{margin:0;font:15px/1.55 var(--serif);padding-left:28px;text-indent:-28px}
.ref .w{display:flex;flex-wrap:wrap;gap:6px}
.ref .w span{font:600 11.5px/1 var(--head);padding:5px 8px;border-radius:999px;background:var(--surface-3);color:var(--navy)}
.ref .w em{font-size:12.5px;color:var(--ink-3)}
.toc-mobile{display:none}
.footnote{margin-top:30px;font-size:13px;color:var(--ink-3);text-align:center}

@media (max-width:1000px){
  .notes{grid-template-columns:1fr}
  .side{display:none}
  .toc-mobile{display:block;margin-bottom:14px}
  .toc-mobile select{width:100%;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:600 14px var(--head)}
  .hero{grid-template-columns:1fr}
  .g3{grid-template-columns:repeat(2,minmax(0,1fr))}
  html{scroll-padding-top:120px}
}
@media (max-width:640px){
  .top-inner,.wrap{padding-left:16px;padding-right:16px}
  .g2,.g3{grid-template-columns:1fr}
  .pc{grid-template-columns:1fr}
  .pc .num{grid-row:auto}
  .sec-h{flex-direction:column}
  .sec-h,.paras,.qa{padding-left:16px;padding-right:16px}
  .overview{margin-left:16px;margin-right:16px}
  .gl{grid-template-columns:1fr}
  .hero{padding:22px 20px}
  .fc{height:420px}
  .brandrow .n{font-size:15px}
  .iconbtn .lbl{display:none}
  .timer{position:static}
}
@media print{
  .top,.side,.searchbar,.toc-mobile,.orig-btn,.done-btn,.timer .btns{display:none!important}
  .view{display:block!important;page-break-before:always}
  .view#v-notes{page-break-before:auto}
  .pc .orig{display:block}
  body{background:#fff}
  .sec,.card,.pc{box-shadow:none;break-inside:avoid}
  #v-flash{display:none!important}
}
</style>
</head>
<body>
<header class="top">
  <div class="top-inner">
    <div class="brandrow">
      <div style="display:flex;align-items:center;gap:12px;min-width:0">{{LOGO}}<div class="t">
        <span class="k">{{KICKER}}</span>
        <span class="n">{{SHORT}}</span>
      </div></div>
      <div class="tools">
        <button class="iconbtn" id="themeBtn" title="Toggle light/dark"><span aria-hidden="true">◐</span><span class="lbl">Theme</span></button>
        <button class="iconbtn" onclick="window.print()" title="Print or save as PDF"><span aria-hidden="true">⎙</span><span class="lbl">Print</span></button>
      </div>
    </div>
    <nav class="tabs" role="tablist" id="tabs"></nav>
  </div>
</header>

<main class="wrap">
  <section class="view" id="v-notes">
    <div class="hero">
      <div>
        <h1>{{H1}}</h1>
        <div class="who">{{WHO}}</div>
        <div class="chips">
{{CHIPS}}
        </div>
      </div>
      <div class="prog">
        <div class="lbl">Your review progress</div>
        <div class="big" id="progBig">0 / 0</div>
        <div class="bar"><i id="progBar" style="width:0%"></i></div>
        <p>Mark each section as reviewed once you can explain it without notes. Progress is saved in this browser.</p>
      </div>
    </div>
    <div class="notes">
      <aside class="side" id="side" aria-label="Sections"></aside>
      <div>
        <div class="toc-mobile"><select id="tocSel" aria-label="Jump to section"></select></div>
        <div class="searchbar">
          <label class="search"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
            <input id="q" type="search" placeholder="Search notes, manuscript text, and study questions…" autocomplete="off"></label>
          <label class="toggle"><input type="checkbox" id="showOrig"> Show manuscript text</label>
          <span class="count" id="count"></span>
        </div>
        <div id="secs"></div>
      </div>
    </div>
  </section>

  <section class="view" id="v-big"></section>
  <section class="view" id="v-script"></section>
  <section class="view" id="v-qa"></section>
  <section class="view" id="v-flash"></section>
  <section class="view" id="v-nums"></section>
  <section class="view" id="v-gloss"></section>
  <section class="view" id="v-src"></section>
  <p class="footnote">{{FOOTNOTE}}</p>
</main>

<script>
const DATA = {{DATA}};
const store = {
  get(k, d){ try{ const v = localStorage.getItem('{{STORE}}:'+k); return v===null? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem('{{STORE}}:'+k, JSON.stringify(v)); }catch(e){} }
};
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];

/* theme */
(function(){
  const t = store.get('theme', null); if(t) document.documentElement.dataset.theme = t;
  $('#themeBtn').onclick = () => {
    const cur = document.documentElement.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    const nx = cur === 'dark' ? 'light' : 'dark';
    document.documentElement.dataset.theme = nx; store.set('theme', nx);
  };
})();

/* tabs */
const TABS = [['notes','Study Notes'],['big','Big Picture'],['script','Presentation Notes'],['qa','Study Q&A'],['flash','Flashcards'],['nums','Key Numbers'],['gloss','Glossary'],['src','Sources']];
function showTab(id){
  $$('.tab').forEach(b => b.setAttribute('aria-selected', b.dataset.t===id));
  $$('.view').forEach(v => v.classList.toggle('on', v.id==='v-'+id));
  store.set('tab', id); window.scrollTo({top:0});
}
$('#tabs').innerHTML = TABS.map(([id,l]) => `<button class="tab" role="tab" data-t="${id}">${l}</button>`).join('');
$$('.tab').forEach(b => b.onclick = () => showTab(b.dataset.t));

/* notes */
const CH = DATA.chapters;
const reviewed = new Set(store.get('reviewed', []));
let pn = 0;
function renderNotes(){
  let side = '', sel = '', html = '', lastCh = 0;
  DATA.sections.forEach(s => {
    if(s.ch !== lastCh){ side += `<h4>${CH[s.ch]}</h4>`; sel += `${lastCh?'</optgroup>':''}<optgroup label="${CH[s.ch]}">`; lastCh = s.ch; }
    side += `<a href="#s-${s.id}" data-s="${s.id}"><span class="dot"></span>${esc(s.title)}</a>`;
    sel += `<option value="${s.id}">${esc(s.title)}</option>`;
    const paras = s.paras.map((p,i) => { pn++; return `
      <article class="pc" data-txt="${esc((p.label+' '+p.gist+' '+p.role+' '+p.orig).toLowerCase())}">
        <div class="num">${p.n ? esc(p.n) : '¶'+(i+1)}</div>
        <h3>${esc(p.label)}</h3>
        <div><div class="lab">What it says</div><p class="gist">${esc(p.gist)}</p></div>
        ${p.role ? `<div><div class="lab">Why it's there · how to present it</div><p class="role">${esc(p.role)}</p></div>` : ''}
        <div><button class="orig-btn" type="button"><span class="chev">›</span> Manuscript text</button><div class="orig">${esc(p.orig)}</div></div>
      </article>`; }).join('');
    const qa = s.qa.length ? `<div class="qa"><h4>Likely study questions</h4>${s.qa.map(x => `
      <details data-txt="${esc((x.q+' '+x.a).toLowerCase())}"><summary>${esc(x.q)}</summary><div class="ans">${esc(x.a)}</div></details>`).join('')}</div>` : '';
    html += `<section class="sec" id="s-${s.id}" data-s="${s.id}">
      <div class="sec-h"><div><div class="meta"><span class="tag">${CH[s.ch].split(' · ')[0]}</span><span class="tag sl">${esc(s.slides)}</span></div><h2>${esc(s.title)}</h2></div>
        <button class="done-btn" type="button" data-s="${s.id}" aria-pressed="false">Mark reviewed</button></div>
      <div class="overview"><b>What this section does</b>${esc(s.overview)}</div>
      <div class="paras">${paras}</div>${qa}</section>`;
  });
  $('#side').innerHTML = side; $('#tocSel').innerHTML = sel + '</optgroup>'; $('#secs').innerHTML = html;
  $('#tocSel').onchange = e => document.getElementById('s-'+e.target.value).scrollIntoView();
  $$('.orig-btn').forEach(b => b.onclick = () => b.closest('.pc').classList.toggle('open'));
  $$('.done-btn').forEach(b => b.onclick = () => { const id=b.dataset.s; reviewed.has(id)?reviewed.delete(id):reviewed.add(id); store.set('reviewed',[...reviewed]); syncDone(); });
  syncDone();
}
function syncDone(){
  $$('.done-btn').forEach(b => { const on = reviewed.has(b.dataset.s); b.setAttribute('aria-pressed', on); b.textContent = on ? '✓ Reviewed' : 'Mark reviewed'; });
  $$('.side a').forEach(a => a.classList.toggle('done', reviewed.has(a.dataset.s)));
  const n = DATA.sections.length, k = DATA.sections.filter(s => reviewed.has(s.id)).length;
  $('#progBig').textContent = `${k} / ${n} sections`; $('#progBar').style.width = (100*k/n)+'%';
}
renderNotes();
$('#showOrig').onchange = e => $$('.pc').forEach(c => c.classList.toggle('open', e.target.checked));

/* search with highlight */
function clearMarks(root){ $$('mark', root).forEach(m => m.replaceWith(document.createTextNode(m.textContent))); root.normalize(); }
function markIn(el, term){
  const walker = document.createTreeWalker(el, NodeFilter.SHOW_TEXT); const nodes=[]; let n;
  while(n = walker.nextNode()) if(n.nodeValue.toLowerCase().includes(term)) nodes.push(n);
  nodes.forEach(node => {
    const frag = document.createDocumentFragment(); let s = node.nodeValue, lower = s.toLowerCase(), i = 0, j;
    while((j = lower.indexOf(term, i)) > -1){ frag.append(s.slice(i,j)); const m=document.createElement('mark'); m.textContent=s.slice(j,j+term.length); frag.append(m); i=j+term.length; }
    frag.append(s.slice(i)); node.replaceWith(frag);
  });
}
let qt;
$('#q').addEventListener('input', e => { clearTimeout(qt); qt = setTimeout(() => doSearch(e.target.value.trim().toLowerCase()), 120); });
function doSearch(term){
  const secs = $('#secs'); clearMarks(secs);
  let hits = 0;
  $$('.sec', secs).forEach(sec => {
    let any = false;
    $$('.pc, details', sec).forEach(el => {
      const ok = !term || el.dataset.txt.includes(term);
      el.classList.toggle('hidden', !ok);
      if(ok && term){ any = true; hits++; if(el.matches('.pc') && el.querySelector('.orig').textContent.toLowerCase().includes(term)) el.classList.add('open'); if(el.tagName==='DETAILS') el.open = true; }
    });
    const secHit = term && (sec.querySelector('h2').textContent + sec.querySelector('.overview').textContent).toLowerCase().includes(term);
    sec.classList.toggle('hidden', !!term && !any && !secHit);
    if(term) markIn(sec, term);
  });
  $('#count').textContent = term ? `${hits} match${hits===1?'':'es'}` : '';
}

/* scrollspy */
const spy = new IntersectionObserver(es => es.forEach(e => { if(e.isIntersecting){ $$('.side a').forEach(a => a.classList.toggle('cur', a.dataset.s===e.target.dataset.s)); } }), {rootMargin:'-140px 0px -60% 0px'});
$$('.sec').forEach(s => spy.observe(s));

  const B = DATA.big;
  $('#v-big').innerHTML = `

    <div class="card"><div class="kicker" style="margin-top:0">The study in 60 seconds</div><ol class="pitch">${DATA.elevator.map(x=>`<li><span>${esc(x)}</span></li>`).join('')}</ol></div>
    <div class="card"><div class="kicker" style="margin-top:0">${esc(B.modelTitle)}</div>
      ${B.modelSvg}
      <p style="margin:6px 0 0;color:var(--ink-2);font-size:14px">${esc(B.modelNote)}</p>
    </div>
  </div>
  ${B.rows.length ? `<div class="kicker">${esc(B.tableTitle)}</div>
  <div class="tablewrap"><table class="t"><thead><tr>${B.tableHead.map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>
    ${B.rows.map(r=>`<tr><td><b>${esc(r[0])}</b></td><td>${esc(r[1])}</td><td>${esc(r[2])}</td><td>${esc(r[3])}</td></tr>`).join('')}</tbody></table></div>` : ''}
  <div class="kicker">How the manuscript is built</div>
  <div class="grid g3">
    ${B.cards.map(c=>`<div class="card"><h3>${esc(c.h)}</h3><p style="margin:0;color:var(--ink-2)">${esc(c.p)}</p></div>`).join('')}
  </div>`;

/* presentation notes with rehearsal timer */
(function(){
  const per = 70; // suggested seconds per slide
  $('#v-script').innerHTML = `
    <div class="timer"><div><div class="clock" id="clk">00:00</div><div class="sub">Suggested pace: about 1 minute per slide (${esc(DATA.pace)}). Current slide: <b id="curS">1</b> of ${DATA.slides.length}</div></div>
      <div class="btns"><button class="btn" id="tStart">Start</button><button class="btn ghost" id="tPrev">◀ Prev slide</button><button class="btn ghost" id="tNext">Next slide ▶</button><button class="btn ghost" id="tReset">Reset</button></div></div>
    ${DATA.slides.map(s => `<div class="slide" id="sl-${s.n}"><div class="sn">${s.n}</div><div><h3>${esc(s.title)}</h3><p>${esc(s.note)}</p></div></div>`).join('')}`;
  let t = 0, run = null, cur = 1;
  const fmt = x => String(Math.floor(x/60)).padStart(2,'0')+':'+String(x%60).padStart(2,'0');
  const setCur = n => { cur = Math.max(1, Math.min(DATA.slides.length, n)); $('#curS').textContent = cur; $$('.slide').forEach(e => e.classList.toggle('cur', e.id==='sl-'+cur)); const el = $('#sl-'+cur); if(el) el.scrollIntoView({block:'center', behavior:'smooth'}); };
  $('#tStart').onclick = () => { if(run){ clearInterval(run); run=null; $('#tStart').textContent='Resume'; } else { run = setInterval(()=>{ t++; $('#clk').textContent = fmt(t); }, 1000); $('#tStart').textContent='Pause'; } };
  $('#tNext').onclick = () => setCur(cur+1); $('#tPrev').onclick = () => setCur(cur-1);
  $('#tReset').onclick = () => { clearInterval(run); run=null; t=0; $('#clk').textContent='00:00'; $('#tStart').textContent='Start'; setCur(1); };
  setTimeout(()=>$$('.slide').forEach(e => e.classList.toggle('cur', e.id==='sl-1')), 0);
})();

/* study Q&A (all sections) */
(function(){
  let h = `<div class="searchbar"><label class="search"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="qq" type="search" placeholder="Filter questions…"></label>
    <button class="iconbtn" id="qaOpen">Expand all</button><button class="iconbtn" id="qaClose">Collapse all</button></div>`;
  DATA.sections.forEach(s => { if(!s.qa.length) return;
    h += `<div class="kicker">${esc(s.title)}</div>` + s.qa.map(x => `<details data-txt="${esc((x.q+' '+x.a).toLowerCase())}"><summary>${esc(x.q)}</summary><div class="ans">${esc(x.a)}</div></details>`).join(''); });
  $('#v-qa').innerHTML = h;
  $('#qq').oninput = e => { const t = e.target.value.trim().toLowerCase(); $$('#v-qa details').forEach(d => d.classList.toggle('hidden', !!t && !d.dataset.txt.includes(t))); };
  $('#qaOpen').onclick = () => $$('#v-qa details').forEach(d => d.open = true);
  $('#qaClose').onclick = () => $$('#v-qa details').forEach(d => d.open = false);
})();

/* flashcards */
(function(){
  const decks = {
    qa: DATA.sections.flatMap(s => s.qa.map(x => ({t:s.title, q:x.q, a:x.a}))),
    nums: DATA.numbers.map(n => ({t:'Key number', q:`What does "${n.v}" refer to in the study?`, a:n.t})),
    terms: DATA.glossary.map(g => ({t:'Glossary', q:g.term, a:g.def_}))
  };
  let deck = 'qa', order = [], i = 0;
  $('#v-flash').innerHTML = `<div class="fc-wrap">
    <div class="fc-controls"><div class="seg" id="deckSeg"><button data-d="qa" aria-pressed="true">Study Q&amp;A (${decks.qa.length})</button><button data-d="nums" aria-pressed="false">Key numbers (${decks.nums.length})</button><button data-d="terms" aria-pressed="false">Terms (${decks.terms.length})</button></div>
      <button class="iconbtn" id="shuf">⤮ Shuffle</button></div>
    <div class="fc" id="fc" tabindex="0" role="button" aria-label="Flashcard, press to flip"><div class="fc-in">
      <div class="face front"><div class="ft" id="fT"></div><div class="fq" id="fQ"></div></div>
      <div class="face back"><div class="ft">Answer</div><div class="fa" id="fA"></div></div></div></div>
    <div class="fc-nav"><button class="btn ghost" id="fPrev">◀ Previous</button><span class="pos" id="fPos"></span><button class="btn" id="fNext">Next ▶</button></div>
    <p class="hint">Click the card or press Space to flip · ← → to move</p></div>`;
  const load = () => { const c = decks[deck][order[i]]; $('#fc').classList.remove('flip'); $('#fT').textContent = c.t; $('#fQ').textContent = c.q; $('#fA').textContent = c.a; $('#fPos').textContent = `${i+1} / ${order.length}`; };
  const reset = (shuffle) => { order = decks[deck].map((_,k)=>k); if(shuffle) for(let k=order.length-1;k>0;k--){ const j=Math.floor(Math.random()*(k+1)); [order[k],order[j]]=[order[j],order[k]]; } i = 0; load(); };
  $$('#deckSeg button').forEach(b => b.onclick = () => { deck = b.dataset.d; $$('#deckSeg button').forEach(x => x.setAttribute('aria-pressed', x===b)); reset(false); });
  $('#shuf').onclick = () => reset(true);
  $('#fc').onclick = () => $('#fc').classList.toggle('flip');
  $('#fNext').onclick = () => { i = (i+1) % order.length; load(); };
  $('#fPrev').onclick = () => { i = (i-1+order.length) % order.length; load(); };
  document.addEventListener('keydown', e => { if(!$('#v-flash').classList.contains('on') || e.target.matches('input')) return;
    if(e.key===' '){ e.preventDefault(); $('#fc').classList.toggle('flip'); } if(e.key==='ArrowRight') $('#fNext').click(); if(e.key==='ArrowLeft') $('#fPrev').click(); });
  reset(false);
})();

/* numbers, glossary, sources */
$('#v-nums').innerHTML = `<p class="lead" style="margin-top:0">Key figures from the study. Cover the description and test yourself.</p><div class="grid g3">${DATA.numbers.map(n => `<div class="num-card"><div class="v">${esc(n.v)}</div><div class="d">${esc(n.t)}</div></div>`).join('')}</div>`;
$('#v-gloss').innerHTML = `<div class="searchbar"><label class="search"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="gq" type="search" placeholder="Filter terms…"></label></div>
  <div class="card"><dl style="margin:0">${DATA.glossary.map(g => `<div class="gl" data-txt="${esc((g.term+' '+g.def_).toLowerCase())}"><dt>${esc(g.term)}</dt><dd>${esc(g.def_)}</dd></div>`).join('')}</dl></div>`;
$('#gq').oninput = e => { const t=e.target.value.trim().toLowerCase(); $$('#v-gloss .gl').forEach(x => x.classList.toggle('hidden', !!t && !x.dataset.txt.includes(t))); };
$('#v-src').innerHTML = `<div class="searchbar"><label class="search"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="rq" type="search" placeholder="Filter ${DATA.refs.length} references…"></label></div>
  <div class="card">${DATA.refs.map(r => `<div class="ref" data-txt="${esc(r.text.toLowerCase())}"><p>${esc(r.text)}</p><div class="w">${r.where.length ? '<em>Cited in:</em>' + r.where.map(w=>`<span>${esc(w)}</span>`).join('') : '<em style="color:var(--accent)">Not cited anywhere in the manuscript text: cite it or remove it from the list</em>'}</div></div>`).join('')}</div>`;
$('#rq').oninput = e => { const t=e.target.value.trim().toLowerCase(); $$('#v-src .ref').forEach(x => x.classList.toggle('hidden', !!t && !x.dataset.txt.includes(t))); };

showTab(store.get('tab','notes'));
</script>
